  <style>
    /* Self-hosted latin subsets (OFL): Mona Sans 110-125% width, 700-900 weight; Manrope 500-700 */
    @font-face { font-family: "Mona Sans"; src: url(/fonts/mona-sans-latin.woff2) format("woff2"); font-weight: 700 900; font-stretch: 110% 125%; font-display: swap; }
    @font-face { font-family: "Manrope"; src: url(/fonts/manrope-latin.woff2) format("woff2"); font-weight: 500 700; font-display: swap; }

    *, *::before, *::after { box-sizing: border-box; }
    html { height: 100%; }

    :focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .links a { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 20px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); font: 700 15px/1 "Mona Sans", system-ui, sans-serif; font-stretch: 110%; text-decoration: none; transition: background-color .2s, color .2s, border-color .2s; }
    .links a:hover { background: var(--ink); color: #fff; }
    .links a.btn-solid { background: var(--ink); color: #fff; }
    .links a.btn-solid:hover { background: #33363b; border-color: #33363b; }
    .links svg { width: 14px; height: 14px; flex: none; }

    /* The name fills the width; a soft-focus portrait drifts inside the letters,
       seen up close through a screen: RGB subpixels, faint scanlines, a little colour fringing */
    h1 { margin: 0; font-family: "Mona Sans", system-ui, sans-serif; font-weight: 900; font-stretch: 125%; text-transform: uppercase; letter-spacing: -.045em; line-height: .84; font-size: 12.6vw;
         color: var(--ink);

           repeating-linear-gradient(0deg, rgb(0 0 0 / .13) 0 1px, transparent 1px 4px),

         background-position: 0 0, 0 0, 0 0, 0% 40%;
         -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
         animation: pan 34s ease-in-out infinite alternate; }

    h1 span { display: block; white-space: nowrap; }
    h1 { overflow: clip; overflow-clip-margin: .04em; }
    h1 .l1 { font-size: min(2.47em, 58vh); }
    /* Red and blue ghosts, nudged apart, for the colour fringe */
    /* Kept in the normal flow (a zero-height line laid over the text) rather than positioned:
       Safari leaves positioned text out of the photo fill, which turned the name pale purple on iPhones */
    h1 span::before { content: attr(data-text); display: block; height: 0; margin-left: -.014em; pointer-events: none; mix-blend-mode: multiply;
      -webkit-text-fill-color: rgb(255 20 70 / .3); text-shadow: .028em 0 rgb(20 120 255 / .3); }
    /* Terminal block cursor */
    /* The negative right margin keeps the cursor from wrapping once a line fills the width */
    .caret { display: inline-block; width: .48em; height: .7em; margin: 0 -.56em 0 .08em; vertical-align: baseline; background: var(--ink); box-shadow: -.02em 0 rgb(255 20 70 / .55), .02em 0 rgb(20 120 255 / .55); animation: blink 1.06s steps(1) infinite; }
    .caret.busy { animation: none; }
    @keyframes blink { 50% { opacity: 0; } }

    /* The paint stage is drawn on a canvas over the page, fitted to the real letters.
       The typed letters stay in place underneath, so the layout never moves. */
    body { position: relative; }
    .top { position: relative; z-index: 1; }
    .art { position: absolute; left: 0; top: 0; pointer-events: none; transition: opacity .7s ease; }
    .art.gone { opacity: 0; }
    /* In the type spec, the letters are plain ink, like a spec sheet */
    h1 { transition: -webkit-text-fill-color 1.2s ease; }

    h1 b { position: relative; font: inherit; }

    @media (max-width: 760px) { .top { flex-direction: column; } h1 { font-size: 11.6vw; } }
    @media (prefers-reduced-motion: reduce) { h1 { animation: none; } .links a { transition: none; } }

  <h1 id="name" aria-label="Alex Grinshpoon"><span class="l1" data-text="Alex" aria-hidden="true">Alex</span><span class="l2" data-text="Grinshpoon" aria-hidden="true">Grinshpoon</span></h1>
  <script>
    // The name plays out once, then settles:

        caret.classList.add('busy');

        caret.classList.remove('busy');

        await wait(1300);
        await type(l1, words[0]);
        await wait(650);

        set(l1, words[0], false);
        h1.append(l2); set(l2, '');
        const lineH = l2.getBoundingClientRect().height;
        l2.animate([{ height: '0px' }, { height: lineH + 'px' }], { duration: 520, easing: 'cubic-bezier(.2, .7, .2, 1)' });
        await wait(870);
        await type(l2, words[1]);

      const art = document.createElement('canvas');

      // Also returns each letter's ink box, which the brush paths are fitted to.

            glyphs.push({ ch, x0: x - b.actualBoundingBoxLeft * sx, x1: x + b.actualBoundingBoxRight * sx, y0: base - b.actualBoundingBoxAscent, y1: base + b.actualBoundingBoxDescent, line: span === l1 ? 0 : 1 });

      }

        const px = Math.round(x * K), py = Math.round(y * K);
        return px >= 0 && py >= 0 && px < art.width && py < art.height && mask.data[(py * art.width + px) * 4 + 3] > 127;
      };

      const show = () => { art.style.transition = 'none'; art.classList.remove('gone'); art.offsetWidth; art.style.transition = ''; };

      const rgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));

      // ---- Brush lettering: every stroke of every letter is one brush stroke in one colour ----
      // Stem thickness, measured from the real letters: the run of ink across a straight stem
      function stems(mask) {
        const out = [];
        for (const line of [0, 1]) {

        const out = [];

          for (let t = 0; t < 1; t += .1) {

      };
      // The strokes a sign painter would make for each letter, fitted to the letter's ink box
      function strokesFor(g, w) {
        const { x0, x1, y0, y1 } = g, b = w * .74, bw = x1 - x0, bh = y1 - y0, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
        const Lx = x0 + w / 2, Rx = x1 - w / 2, Ty = y0 + b / 2, By = y1 - b / 2, o = w * .12;
        const bowl = bottom => { const ry = (bottom - Ty) / 2, rx = Math.min(ry * 1.15, bw * .42); return [[x0, Ty], [Rx - rx, Ty], ...arc(Rx - rx, Ty + ry, rx, ry, -Math.PI / 2, Math.PI / 2, 24).slice(1), [x0 + w * .4, Ty + ry * 2]]; };

          case 'A': return [[[x0 + w * .55, y1 + o], [cx, y0 + w * .2]], [[cx, y0 + w * .2], [x1 - w * .55, y1 + o]], [[x0 + bw * .26, y0 + bh * .7], [x1 - bw * .26, y0 + bh * .7]]];
          case 'L': return [[[Lx, y0 - o], [Lx, y1]], [[x0, By], [x1 + o, By]]];
          case 'E': return [[[Lx, y0], [Lx, y1]], [[x0, Ty], [x1 + o * .5, Ty]], [[x0, cy], [x1 - bw * .06, cy]], [[x0, By], [x1 + o * .5, By]]];
          case 'X': return [[[x0 + w * .45, y0 - o * .5], [x1 - w * .45, y1 + o * .5]], [[x1 - w * .45, y0 - o * .5], [x0 + w * .45, y1 + o * .5]]];
          case 'G': return [arc(cx, cy, bw / 2 - w / 2, bh / 2 - b / 2, -.2 * Math.PI, -1.97 * Math.PI), [[cx + bw * .02, y0 + bh * .56], [Rx, y0 + bh * .56], [Rx, y1 - b * .4]]];
          case 'R': return [[[Lx, y0], [Lx, y1 + o]], bowl(y0 + bh * .56), [[x0 + bw * .42, y0 + bh * .56], [Rx, y1 + o]]];
          case 'P': return [[[Lx, y0], [Lx, y1 + o]], bowl(y0 + bh * .62)];
          case 'I': return [[[cx, y0 - o], [cx, y1 + o]]];
          case 'N': return [[[Lx, y1 + o], [Lx, y0]], [[Lx, y0], [Rx, y1]], [[Rx, y1], [Rx, y0 - o]]];
          case 'H': return [[[Lx, y0 - o], [Lx, y1 + o]], [[Rx, y0 - o], [Rx, y1 + o]], [[x0 + w * .3, cy], [x1 - w * .3, cy]]];
          case 'O': return [arc(cx, cy, bw / 2 - w / 2, bh / 2 - b / 2, -Math.PI / 2, -Math.PI / 2 - 2.06 * Math.PI, 60)];

        for (const gl of bottom.slice(0, R() < .5 ? 1 : 2)) {
          const y = gl.y1 - 2 * u, xs = [];
          for (let x = gl.x0; x <= gl.x1; x += 3 * u) if (inside(mask, x, y)) xs.push(x);
          if (xs.length) drips.push({ x: pick(xs), y: gl.y1 - 3 * u, len: (35 + R() * 55) * u, w: (4 + R() * 2.5) * u, color: null, t0: painted + 200 + drips.length * 450 });
        }
        const end = Math.max(...strokes.map(b => b.t0 + b.dur), ...drips.map(d => d.t0 + 1500)) + 100;
        show();
        const start = performance.now();
        for (let now = 0; now < end; now = (await frame()) - start) {
          if (g !== generation) throw Stale;
          for (const b of strokes) {
            if (b.done || now < b.t0) continue;
            const k = Math.min(1, (now - b.t0) / b.dur);
            drawPath(cc, b, k);
            if (k === 1) {
              // Where this stroke crosses earlier ones, the colours mix like a translucent glaze
              b.done = true;
              bc.setTransform(1, 0, 0, 1, 0, 0); glaze(bc, Cur); bc.setTransform(K, 0, 0, K, 0, 0);
              cc.setTransform(1, 0, 0, 1, 0, 0); cc.clearRect(0, 0, Cur.width, Cur.height); cc.setTransform(K, 0, 0, K, 0, 0);
            }
          }
          ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, art.width, art.height);
          ctx.drawImage(Bp, 0, 0); glaze(ctx, Cur);
          ctx.setTransform(K, 0, 0, K, 0, 0);
          for (const d of drips) {
            if (now < d.t0) continue;
            if (!d.color) {
              // Pick up the paint colour just above where the drip starts
              const px = bc.getImageData(Math.round(d.x * K), Math.round((d.y - 6 * u) * K), 1, 1).data;
              d.color = px[3] > 160 ? `rgb(${px[0]},${px[1]},${px[2]})` : '#151413';
            }
            drawDrip(ctx, d, Math.min(1, (now - d.t0) / 1500));
          }
        }
        // Keep the finished painting, so the next stage can fade it out
        const [final, fc] = layer(); fc.setTransform(1, 0, 0, 1, 0, 0); fc.drawImage(art, 0, 0);
        return { mask, stem, final };
      }
      function drawDrip(c, d, k) {
        if (k <= 0) return;
        const e = 1 - (1 - k) ** 3, y2 = d.y + d.len * e;
        c.fillStyle = d.color; c.fillRect(d.x - d.w / 2, d.y, d.w, y2 - d.y);
        c.beginPath(); c.arc(d.x, y2, d.w * .6, 0, Math.PI * 2); c.fill();
        c.fillStyle = 'rgba(255,255,255,.14)'; c.fillRect(d.x - d.w * .3, d.y, d.w * .14, y2 - d.y);
      }

      // ---- 3. Type spec: guides go down over the paint, the paint fades, a designer fixes the spacing ----
      const SPEC = '#ff7a3d';
      async function spec(painted) {
        const g = generation, { mask } = painted, gl = mask.glyphs;
        const rows = [[l1, words[0]], [l2, words[1]]].map(([el, word], line) => {
          const gs = gl.filter(x => x.line === line);
          return { el, word, gs, fs: parseFloat(getComputedStyle(el).fontSize), letters: [], off: gs.map(() => 0), cap: Math.min(...gs.map(x => x.y0)), base: Math.max(...gs.map(x => x.y1)) };
        });
        // Under the fading paint, the letters become plain ink, each its own element, set a little off like a rough sketch
        const sketch = () => {
          for (const r of rows) {
            r.el.textContent = '';
            r.letters = [...r.word].map(ch => { const b = document.createElement('b'); b.textContent = ch; r.el.append(b); return b; });
            r.off = r.letters.map((_, i) => i === 0 || i === r.letters.length - 1 ? 0 : (R() < .5 ? -1 : 1) * r.fs * (.018 + R() * .03));
          }
          h1.classList.add('spec');
        };
        const place = () => rows.forEach(r => r.letters.forEach((b, i) => { b.style.left = r.off[i] ? r.off[i].toFixed(2) + 'px' : ''; }));
        const left = region.x - 18 * u, right = region.x + region.w + 18 * u, lw = Math.max(2, 4 * u);
        const fsz = Math.max(15, Math.min(34, 30 * u)), gap = Math.max(5, 9 * u);
        const lines = [
          { y: rows[0].cap, color: SPEC, d: 0 }, { y: rows[0].base, color: SPEC, d: 90 },
          { y: (rows[0].cap + rows[0].base) / 2, color: 'rgba(17,18,20,.14)', d: 140 },
          { y: rows[1].cap, color: SPEC, d: 180 }, { y: rows[1].base, color: SPEC, d: 270 }
        ];
        const labels = [
          { text: 'Cap Height', x: right, y: rows[0].cap - gap, align: 'right', d: 700 },
          { text: 'Kerning', x: (left + right) / 2, y: rows[0].cap - gap, align: 'center', d: 800 },
          { text: 'Baseline', x: left, y: rows[1].base + gap + fsz * .8, align: 'left', d: 900 },
          { text: 'Spacing', x: (left + right) / 2, y: rows[1].base + gap + fsz * .8, align: 'center', d: 1000 }
        ];
        // Timeline: guides in (right to left, over the paint), then the paint fades slowly to the letters,
        // then the spacing is fixed one letter at a time, then the guides leave (left to right)
        const fadeFrom = 1100, fadeTo = 2900, barsAt = 2300, fixAt = 3000;
        const ease = k => 1 - (1 - k) ** 3, inOut = k => k < .5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2, clamp = k => Math.min(1, Math.max(0, k));
        let fixes = null, exitAt = Infinity, end = Infinity, sketched = false;
        const start = performance.now();
        for (let t = 0; t < end; t = (await frame()) - start) {
          if (g !== generation) throw Stale;
          if (!sketched && t >= fadeFrom) {
            sketched = true; sketch(); place();
            fixes = [];
            let at = fixAt;
            rows.forEach((r, ri) => r.off.forEach((o, i) => { if (o) { fixes.push({ ri, i, from: o, t0: at }); at += 330; } }));
            exitAt = at + 900; end = exitAt + 900;
          }
          if (fixes) { for (const f of fixes) rows[f.ri].off[f.i] = f.from * (1 - inOut(clamp((t - f.t0) / 280))); place(); }
          const out = clamp((t - exitAt) / 800), stay = 1 - out;
          ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, art.width, art.height);
          ctx.globalAlpha = 1 - inOut(clamp((t - fadeFrom) / (fadeTo - fadeFrom))); ctx.drawImage(painted.final, 0, 0); ctx.globalAlpha = 1;
          ctx.setTransform(K, 0, 0, K, 0, 0);
          // Gap bars between every pair of letters, sized to the gap as it is right now
          if (fixes) {
            ctx.globalCompositeOperation = 'multiply';
            rows.forEach((r, ri) => {
              const grow = ease(clamp((t - barsAt - ri * 150) / 450)) * (1 - ease(out));
              if (grow <= 0) return;
              for (let i = 0; i < r.gs.length - 1; i++) {
                const a = r.gs[i].x1 + r.off[i], b = r.gs[i + 1].x0 + r.off[i + 1], w = Math.max(3 * u, b - a), x = (a + b) / 2 - w / 2;
                const active = fixes.find(f => f.ri === ri && (f.i === i + 1 || f.i === i) && t >= f.t0 - 60 && t <= f.t0 + 380);
                ctx.fillStyle = active ? 'rgba(255,122,61,.75)' : 'rgba(255,176,120,.5)';
                const hgt = (r.base - r.cap) * grow;
                ctx.fillRect(x, r.base - hgt, w, hgt);
              }
            });
            ctx.globalCompositeOperation = 'source-over';
            // Kerning values, shown on the letter being fixed
            ctx.font = `700 ${fsz * .62}px Manrope, system-ui, sans-serif`; ctx.textAlign = 'center';
            for (const f of fixes) {
              const k = clamp((t - f.t0 + 60) / 120) * clamp((f.t0 + 520 - t) / 160);
              if (k <= 0) continue;
              const r = rows[f.ri], gsl = r.gs[f.i], x = (gsl.x0 + gsl.x1) / 2 + r.off[f.i], y = (r.cap + r.base) / 2;
              const units = Math.round(-f.from / r.fs * 1000), text = (units > 0 ? '+' : '−') + Math.abs(units);
              const tw = ctx.measureText(text).width + fsz * .6, th = fsz * .95;
              ctx.globalAlpha = k; ctx.fillStyle = SPEC;
              ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x - tw / 2, y - th / 2, tw, th, th / 2) : ctx.rect(x - tw / 2, y - th / 2, tw, th); ctx.fill();
              ctx.fillStyle = '#fff'; ctx.fillText(text, x, y + fsz * .22);
            }
            ctx.globalAlpha = 1;
          }
          // Guide lines come in from the right, and leave moving off to the right
          ctx.lineCap = 'round'; ctx.lineWidth = lw;
          for (const l of lines) {
            const into = ease(clamp((t - l.d) / 700)), away = ease(clamp((t - exitAt - l.d * .6) / 650));
            const x0 = right - (right - left) * into, x1 = right, from = x0 + (x1 - x0) * away;
            if (into <= 0 || away >= 1) continue;
            ctx.strokeStyle = l.color; ctx.beginPath(); ctx.moveTo(from, l.y); ctx.lineTo(x1, l.y); ctx.stroke();
          }
          ctx.font = `600 ${fsz}px Manrope, system-ui, sans-serif`; ctx.fillStyle = SPEC;
          for (const l of labels) {
            const k = ease(clamp((t - l.d) / 400)) * stay;
            ctx.globalAlpha = k; ctx.textAlign = l.align; ctx.fillText(l.text, l.x, l.y + (1 - k) * 8 * u);
          }
          ctx.globalAlpha = 1; ctx.textAlign = 'left';
        }
        ctx.clearRect(0, 0, W, H);
        art.classList.add('gone');
      }

      // Whatever happens, end on the black lettering, fully set
      const finish = () => {
        art.classList.add('gone'); if (ctx) ctx.clearRect(0, 0, W, H);
        caret.remove(); h1.classList.add('spec'); lock(false);
        if (!l2.isConnected) h1.append(l2);
        for (const [el, word] of [[l1, words[0]], [l2, words[1]]]) {
          if (el.textContent !== word || el.querySelector('i')) set(el, word, false);
          el.querySelectorAll('b').forEach(b => { b.style.left = ''; });
        }
      };
      (async () => {
        await Promise.race([document.fonts.ready, wait(1500)]);
        try {
          await typeIn();
          await wait(3000);
          caret.remove(); lock(true);
          const painted = await paint();
          await wait(2200);
          await spec(painted);
        } catch (e) {
          if (e !== Stale) throw e;
        }
        finish();
      })();
    })();
  </script>
</body>
